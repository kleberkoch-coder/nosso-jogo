# Monta o site e roda o roteiro de testes em modo demonstração a cada proposta de mudança.
name: Testes do app
# Proposta só de documentos (arquivos .md e a pasta docs/) não roda os testes: nada no app mudou.
# Economia de minutos (27/10/2026): não roda de novo depois do Merge, porque a proposta já passou com o mesmo código
# (a automação "Publicar o site" confere a versão no ar). Para rodar à mão: Actions → Testes do app → Run workflow.
# Proposta atualizada cancela a rodada anterior da mesma proposta, que ficou velha.
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: testes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Conferência da entrega (pelada-v44): versão, Design System, regras e checklist da proposta.
      - name: Conferir a entrega (versão, Design System, regras e checklist)
        if: github.event_name == 'pull_request'
        env:
          DESCRICAO_PR: ${{ github.event.pull_request.body }}
        run: node testes/conferir-entrega.mjs "${{ github.event.pull_request.base.sha }}"
      - name: Conferir tipos, testar as regras de negócio e montar o site (inclui o orçamento de tamanho)
        run: |
          npm install --no-audit --no-fund
          npm run conferir-formato
          npm run checar
          npm run regras
          # Prévia (Firebase Hosting): tem de sair em modo demonstração, sem a configuração real do Firebase (KAN-88)
          CONTEXT=deploy-preview npm run build
          grep -q 'window.FIREBASE_CONFIG = {};' dist/index.html || { echo "::error::A prévia não ficou em modo demonstração."; exit 1; }
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-montado
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: portal-montado
          path: dist-portal

  # Regras do Firebase no emulador (KAN-104): as regras vão ao ar sozinhas no Merge, então são testadas antes.
  regras-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar o emulador e a biblioteca de testes
        run: npm install --no-save --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - name: Testar as regras no emulador
        shell: bash
        run: |
          set -o pipefail
          status=0
          npx firebase emulators:exec --only firestore --project demo-nosso-jogo "node --test testes/regras-firebase/*.test.mjs" 2>&1 | tee "$RUNNER_TEMP/regras.txt" || status=$?
          # Casos que falharam viram avisos visíveis na proposta (os registros completos nem sempre abrem).
          grep -E "^\s*not ok [0-9]+ - " "$RUNNER_TEMP/regras.txt" | sed -E 's/^\s*not ok [0-9]+ - /::error::Regra falhou: /' || true
          grep -E "^\s*(error|code): " "$RUNNER_TEMP/regras.txt" | head -6 | sed -E 's/^\s*/::error::Detalhe: /' || true
          test "$status" -eq 0 || exit "$status"
          pass=$(grep -oE '^# pass [0-9]+' "$RUNNER_TEMP/regras.txt" | grep -oE '[0-9]+' | tail -1)
          fail=$(grep -oE '^# fail [0-9]+' "$RUNNER_TEMP/regras.txt" | grep -oE '[0-9]+' | tail -1)
          test "${pass:-0}" -gt 0 || { echo "::error::Nenhum teste de regra rodou."; exit 1; }
          echo "::notice::Regras do Firebase no emulador: ${pass} passaram, ${fail:-0} falharam."

  testes:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imagem oficial do Playwright: já vem com o navegador instalado.
    container: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-montado
          path: /tmp/demo
      - uses: actions/download-artifact@v4
        with:
          name: portal-montado
          path: /tmp/portal
      - name: Conferir o navegador de testes
        timeout-minutes: 5
        run: |
          pip install playwright==1.47.0
          python -c "import playwright; print('Playwright pronto')"
      - name: Preparar o modo demonstração
        run: |
          python - <<'PY'
          import re, pathlib
          # O portal (site separado) é testado no mesmo endereço de teste, como portal.html
          for orig, dest in [('/tmp/demo/index.html', '/tmp/demo/index.html'), ('/tmp/portal/index.html', '/tmp/demo/portal.html')]:
              s = pathlib.Path(orig).read_text(encoding='utf-8')
              s2, n = re.subn(r'window\.FIREBASE_CONFIG\s*=\s*\{.*?\};', 'window.FIREBASE_CONFIG = {};', s, count=1, flags=re.S)
              assert n == 1, 'Não achei window.FIREBASE_CONFIG em ' + orig
              pathlib.Path(dest).write_text(s2, encoding='utf-8')
          PY
      - name: Rodar os testes
        # 16 min desde a v62: o roteiro passou de 500 verificações e já levava cerca de 9 min (KAN-184 soma ~30 s de espera de propósito).
        timeout-minutes: 16
        run: |
          (cd /tmp/demo && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          cd testes && python testes_app.py http://127.0.0.1:8765/index.html fotos
      - name: Guardar fotos e resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-dos-testes
          path: |
            testes/fotos
            testes/resultado.json

  # Roteiro de gravação contra o EMULADOR do Firebase (KAN-170): o app grava no Firestore de verdade (com as regras),
  # recarrega e confere. Pega o que o modo demonstração não pega (ex.: o defeito do KAN-167).
  persistencia:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: site-montado
          path: /tmp/emu
      - name: Instalar o emulador e o navegador de testes
        run: |
          npm install --no-save --no-audit --no-fund firebase-tools@13
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Ligar o app ao emulador (sem dados reais e sem App Check)
        run: |
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path('/tmp/emu/index.html'); s = p.read_text(encoding='utf-8')
          cfg = ('window.FIREBASE_CONFIG = {apiKey:"teste-emulador",authDomain:"localhost",projectId:"demo-nosso-jogo"};'
                 'window.FIREBASE_EMULADOR = {firestore:"127.0.0.1:8080",auth:"http://127.0.0.1:9099"};')
          s, n = re.subn(r'window\.FIREBASE_CONFIG\s*=\s*\{.*?\};', lambda m: cfg, s, count=1, flags=re.S)
          assert n == 1, 'Não achei window.FIREBASE_CONFIG'
          s = re.sub(r'window\.APP_CHECK_KEY\s*=\s*"[^"]*";?', 'window.APP_CHECK_KEY = "";', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Rodar o roteiro de gravação no emulador
        shell: bash
        run: |
          (cd /tmp/emu && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          npx firebase emulators:exec --only firestore,auth --project demo-nosso-jogo "python testes/persistencia_app.py http://127.0.0.1:8765/index.html"
      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-da-gravacao
          path: testes/resultado-persistencia.json
