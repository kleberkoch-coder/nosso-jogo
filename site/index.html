[hidden]{display:none!important}

.busy{position:relative!important;color:transparent!important;pointer-events:none}

html,body{overscroll-behavior-y:none}
body{-webkit-tap-highlight-color:transparent;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--pitch);color:var(--chalk);background-image:repeating-linear-gradient(90deg,transparent 0 56px,rgba(255,255,255,.045) 56px 112px);padding:20px 18px 18px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-70px;top:50%;width:170px;height:170px;border:2px solid rgba(255,255,255,.14);border-radius:50%;transform:translateY(-50%)}
.top-in{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative;z-index:1;flex-wrap:wrap}
.top h1{font:800 40px/.95 var(--display);margin:0}
.top .sub{opacity:.8;font-size:14px;margin-top:6px}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--chalk);cursor:pointer}
.chip-ic{min-width:38px;min-height:34px;padding:4px 10px;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.ld-ic{padding:6px 10px;font-size:17px;line-height:1}
.demo{background:var(--bib);color:var(--bib-ink);font-size:13px;text-align:center;padding:6px 12px}
.tabs{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:960px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:13px 15px 11px;font:700 17px var(--display);color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:18px 14px 60px}
h2{font:800 28px/1.05 var(--display);margin:0 0 4px}
h3{font:700 20px/1.1 var(--display);margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.stack>*+*{margin-top:14px}

label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}

.team .band.branco{box-shadow:inset 0 0 0 1px var(--field-border)}
.team .th{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px}

.team ul{list-style:none;margin:0;padding:4px 14px 12px}

.quality{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin-top:10px}.quality b{color:var(--ink)}
.board{background:var(--pitch);color:var(--chalk);border-radius:18px;padding:18px;background-image:repeating-linear-gradient(90deg,transparent 0 48px,rgba(255,255,255,.04) 48px 96px)}
.board .sides{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.board .tn{font:700 20px var(--display);display:flex;align-items:center;justify-content:center;gap:8px}
.board .sc{font:800 clamp(72px,18vw,128px)/.9 var(--display)}
.board .x{font:700 28px var(--display);opacity:.5}
#clock{font:800 clamp(44px,11vw,72px)/1 var(--display);text-align:center;margin:12px 0 4px;font-variant-numeric:tabular-nums}
#clock.over{color:var(--bib);animation:blink 1s steps(2) infinite}
.clock-msg{display:table;margin:0 auto 10px;background:var(--bib);color:var(--bib-ink);font:800 18px var(--display);letter-spacing:.4px;padding:4px 14px;border-radius:999px}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#clock.over{animation:none}}
.board .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--chalk)}
.board .btn.bib{background:var(--bib);color:var(--bib-ink);border-color:var(--bib)}
.goals{font-size:13px;opacity:.85;margin-top:6px;min-height:20px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:700 14px var(--display);color:var(--muted)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td.pts{font-weight:700}tr.lead td{background:var(--surface-2)}
.money{font:800 34px/1 var(--display)}.money.neg{color:var(--out)}
.kpis{display:flex;flex-wrap:wrap;gap:24px}.kpis .l{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;flex:1;min-width:60px}.bar i{display:block;height:100%;background:var(--brand)}
.opt{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--field-border);border-radius:10px;cursor:pointer;background:var(--surface);text-align:left}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--surface-2);box-shadow:inset 3px 0 0 var(--brand)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
details>summary{cursor:pointer;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ ";color:var(--muted)}details[open]>summary::before{content:"– "}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);background:var(--surface);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(5,20,12,.55)}
.dlg{padding:18px}.dlg-f{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.starin{display:flex;gap:2px}.starin button{background:none;border:0;font-size:26px;cursor:pointer;color:var(--line);padding:0 2px}.starin button.on{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
.empty{text-align:center;padding:36px 16px}.empty p{max-width:460px;margin:6px auto 16px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.auth{max-width:400px;margin:24px auto}
.pwr{list-style:none;margin:-4px 0 12px;padding:0;font-size:13px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}

.ou{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:12px}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{background:none;border:0;color:var(--in);font-weight:600;cursor:pointer;text-decoration:underline;padding:0;font-size:inherit}
.hero-land{text-align:center;margin:8px auto 4px;max-width:520px}
.hero-land p{margin:6px 0 0}
.bar-net{background:var(--net-bar);color:#fff;font-size:13px;text-align:center;padding:6px 12px}
.bar-upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:var(--shadow-float);max-width:92vw}
.bar-upd .btn{padding:6px 12px}

.tag.alt{color:var(--out)}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin-top:8px}
.chk label{display:flex;gap:6px;align-items:center;font-size:14px}

.theme-menu .tm-t{font:700 13px var(--body);color:var(--muted);padding:6px 10px 2px;margin:0}
.theme-menu button{display:flex;align-items:center;gap:10px;min-height:var(--touch-min);padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-weight:600;cursor:pointer;text-align:left}
.theme-menu button .ic{width:22px;text-align:center;font-size:17px}
.theme-menu button .hint{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.theme-menu button[aria-checked="true"]{background:var(--primary);color:var(--on-primary)}
.theme-menu button[aria-checked="true"] .hint{color:var(--on-primary)}
.theme-menu button:hover:not([aria-checked="true"]){background:var(--surface-2)}
.theme-seg{display:flex;border:1px solid var(--field-border);border-radius:10px;overflow:hidden}
.theme-seg button{flex:1;min-height:var(--touch-min);border:0;background:var(--surface);color:var(--muted);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.theme-seg button[aria-checked="true"]{background:var(--primary);color:var(--on-primary)}
</style>

<body>
<div id="net" class="bar-net" hidden>Sem internet. O que você fizer agora é enviado quando a conexão voltar.</div>
<div id="demo" class="demo" hidden>Modo demonstração: os dados ficam só neste navegador. Configure o Firebase (LEIA-ME.md) para usar com o grupo.</div>
<header class="top"><div class="top-in">
  <div><h1 id="gname">Nosso Jogo</h1><div class="sub" id="gsub"></div></div>
  <div class="toprow"><button class="chip" id="installBtn" hidden>📲 Instalar app</button><button class="chip chip-ic" id="themeBtn" data-a="themeMenu" aria-haspopup="menu" aria-expanded="false" aria-label="Tema: Automático">🌓</button><div id="topright"></div></div>
</div></header>
<nav class="tabs" id="tabsnav" hidden><div class="tabs-in" id="tabs" role="tablist" aria-label="Seções do grupo"></div></nav>
<main id="main"><div class="empty muted">Carregando…</div></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="upd" class="bar-upd" hidden><span>Nova versão disponível.</span><button class="btn bib" id="updBtn">Atualizar</button></div>

<script>
/* =================== utilidades =================== */
const $=s=>document.querySelector(s);
const main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const cl=o=>o==null?null:JSON.parse(JSON.stringify(o));
const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=s=>{if(!s)return'';return new Date(s+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','')};
const fmonth=m=>{const t=new Date(m+'-15T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)};
const POS={GOL:'Goleiro',DEF:'Defesa',MEI:'Meio',ATA:'Ataque'};
const APP='Nosso Jogo';
const FUT={pos:[['GOL','Goleiro'],['DEF','Defesa'],['MEI','Meio'],['ATA','Ataque']],key:'GOL',score:[['Gol',1]],og:true,word:'Gols',unit:'gol',min:10};
const SPORTS={
  futebol:Object.assign({n:'Futebol',e:'⚽'},FUT),
  society:Object.assign({n:'Society',e:'⚽'},FUT),
  futsal:Object.assign({n:'Futsal',e:'🥅'},FUT,{min:8}),
  basquete:{n:'Basquete',e:'🏀',pos:[['ARM','Armador'],['ALA','Ala'],['PIV','Pivô']],key:null,score:[['+1',1],['+2',2],['+3',3]],word:'Pontos',unit:'ponto',min:10},
  volei:{n:'Vôlei',e:'🏐',pos:[['LEV','Levantador'],['PON','Ponteiro'],['CEN','Central'],['OPO','Oposto'],['LIB','Líbero']],key:'LEV',score:[['Ponto',1]],word:'Pontos',unit:'ponto',min:20},
  volei_praia:{n:'Vôlei de praia',e:'🏖️',pos:[],pairs:true,score:[['Ponto',1]],word:'Pontos',unit:'ponto',min:20},
  futevolei:{n:'Futevôlei',e:'🦶',pos:[],pairs:true,score:[['Ponto',1]],word:'Pontos',unit:'ponto',min:20},
  beach_tennis:{n:'Beach tennis',e:'🎾',pos:[],pairs:true,score:[['Game',1]],word:'Games',unit:'game',min:20},
  handebol:{n:'Handebol',e:'🤾',pos:[['GOL','Goleiro'],['ARM','Armador'],['PON','Ponta'],['PIV','Pivô']],key:'GOL',score:[['Gol',1]],og:true,word:'Gols',unit:'gol',min:15},
  fut_americano:{n:'Futebol americano',e:'🏈',pos:[['QB','Quarterback'],['ATQ','Ataque'],['LIN','Linha'],['DEF','Defesa']],key:'QB',score:[['TD',6],['Extra',1],['2 pts',2],['FG',3],['Safety',2]],word:'Pontos',unit:'ponto',min:20},
  flag:{n:'Flag football',e:'🚩',pos:[['QB','Quarterback'],['ATQ','Ataque'],['DEF','Defesa']],key:'QB',score:[['TD',6],['Extra 1',1],['Extra 2',2]],word:'Pontos',unit:'ponto',min:20},
  rugby:{n:'Rugby',e:'🏉',pos:[['FOR','Forward'],['BAC','Back']],key:null,score:[['Try',5],['Conversão',2],['Penal',3],['Drop',3]],word:'Pontos',unit:'ponto',min:20},
  hoquei:{n:'Hóquei',e:'🏒',pos:[['GOL','Goleiro'],['DEF','Defesa'],['ATA','Ataque']],key:'GOL',score:[['Gol',1]],og:true,word:'Gols',unit:'gol',min:15},
  outro:{n:'Outro esporte',e:'🏅',pos:[],key:null,score:[['Ponto',1]],word:'Pontos',unit:'ponto',min:15}
};
function sport(){const b=SPORTS[(S.app&&S.app.sport)||'futebol']||SPORTS.futebol,x=(S.app&&S.app.posx)||[];return x.length?Object.assign({},b,{pos:b.pos.concat(x)}):b}
function basePos(){return (SPORTS[(S.app&&S.app.sport)||'futebol']||SPORTS.futebol).pos}
function sportName(a){a=a||S.app||{};return a.sport==='outro'&&a.sportName?a.sportName:(SPORTS[a.sport||'futebol']||SPORTS.futebol).n}
function posKeys(){return sport().pos.map(x=>x[0])}
function posLabel(k){const f=sport().pos.find(x=>x[0]===k);return f?f[1]:''}
function hasPos(){return sport().pos.length>0}
const posIdx=k=>{const i=posKeys().indexOf(k);return i<0?99:i};
function tn(c){return sport().pairs?'Dupla '+((c||0)+1):COL[(c||0)%COL.length].n}
function posTag(id){const k=ppos(id);return hasPos()&&k?`<span class="pos ${k===sport().key?'GOL':''}" title="${esc(posLabel(k))}">${esc(k)}</span>`:''}
const COL=[{n:'Laranja',c:'#F4B183',e:'🟧'},{n:'Azul',c:'#9DBBF0',e:'🟦'},{n:'Amarelo',c:'#F5DC7E',e:'🟨'},{n:'Vermelho',c:'#EFA3A3',e:'🟥'},{n:'Roxo',c:'#C3A8EE',e:'🟪'},{n:'Branco',c:'#E3E6E1',e:'⬜'},{n:'Verde',c:'#9ED3B1',e:'🟩'},{n:'Preto',c:'#4A4A4A',e:'⬛'}];
const col=c=>COL[(c||0)%COL.length];
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms||2800)}
function nextSat(){const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const baseUrl=()=>location.href.split('#')[0];
const linkRodada=id=>baseUrl()+'#/p/'+S.gid+'/r/'+id;
const linkVoto=id=>baseUrl()+'#/p/'+S.gid+'/v/'+id;
const linkProxima=()=>baseUrl()+'#/p/'+S.gid;
const linkConvite=t=>baseUrl()+'#/convite/'+S.gid+'/'+t;
const PWR=[[/.{8,}/,'8 ou mais caracteres'],[/[A-Z]/,'1 letra maiúscula'],[/[0-9]/,'1 número'],[/[^A-Za-z0-9]/,'1 caractere especial']];
const pwOk=p=>PWR.every(([re])=>re.test(p));
const AUTH_CANCEL=['auth/popup-closed-by-user','auth/cancelled-popup-request','auth/user-cancelled'];
function authMsg(e){const c=(e&&e.code)||'';return({
  'auth/invalid-credential':'E-mail ou senha incorretos.','auth/invalid-login-credentials':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.',
  'auth/invalid-email':'Esse e-mail não é válido.','auth/missing-email':'Digite seu e-mail.',
  'auth/email-already-in-use':'Esse e-mail já tem conta. Use a aba Entrar.',
  'auth/weak-password':'A senha não atende aos requisitos.','auth/password-does-not-meet-requirements':'A senha não atende aos requisitos.',
  'auth/too-many-requests':'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.',
  'auth/network-request-failed':'Sem conexão. Verifique a internet e tente de novo.',
  'auth/user-disabled':'Esta conta foi desativada.',
  'auth/account-exists-with-different-credential':'Esse e-mail já tem conta com senha. Entre com e-mail e senha.',
  'auth/popup-blocked':'O navegador bloqueou a janela do Google. Libere as janelas deste site e tente de novo.',
  'auth/operation-not-allowed':'Esse jeito de entrar ainda não foi ativado. Avise o responsável pelo site.',
  'auth/unauthorized-domain':'Este endereço ainda não foi autorizado para entrar com Google. Avise o responsável pelo site.',
  'auth/web-storage-unsupported':'Este navegador está bloqueando o login. Abra o site no Chrome ou no Safari.'
})[c]||'Não foi possível entrar agora. Tente de novo.'}
/* Navegadores embutidos (Instagram, Facebook, alguns apps no Android): o Google não deixa fazer login neles. */
const inAppBrowser=()=>/FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|; wv\)/i.test(navigator.userAgent);
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
/* =================== tema (Automático, Claro, Escuro) =================== */
/* A escolha fica salva neste aparelho e vale para todos, inclusive jogadores sem conta. */
const THEMES=[['auto','🌓','Automático'],['light','☀️','Claro'],['dark','🌙','Escuro']];
const TEMA_K='nj-tema';
const darkMQ=matchMedia('(prefers-color-scheme: dark)');
function getTheme(){try{const t=localStorage.getItem(TEMA_K);return t==='light'||t==='dark'?t:'auto'}catch(e){return 'auto'}}
function effTheme(){const t=getTheme();return t==='auto'?(darkMQ.matches?'dark':'light'):t}
const themeDef=()=>THEMES.find(x=>x[0]===getTheme());
const themeLabel=()=>'Tema: '+themeDef()[2];
function applyTheme(){const t=getTheme(),h=document.documentElement;if(t==='auto')h.removeAttribute('data-theme');else h.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=effTheme()==='dark'?'#173A2A':'#1F5A40';
  document.querySelectorAll('[data-a=themeMenu]').forEach(b=>{b.textContent=themeDef()[1];b.setAttribute('aria-label',themeLabel());b.title=themeLabel()})}
function themeOpts(){const t=getTheme(),now=effTheme()==='dark'?'escuro':'claro';
  return THEMES.map(([k,ic,l])=>`<button role="menuitemradio" aria-checked="${t===k}" data-a="setTheme" data-v="${k}"><span class="ic" aria-hidden="true">${ic}</span>${l}${k==='auto'?`<span class="hint">agora: ${now}</span>`:''}</button>`).join('')}
let themeMenuEl=null,themeAnchor=null;
function closeThemeMenu(back){if(!themeMenuEl)return;themeMenuEl.remove();themeMenuEl=null;if(themeAnchor){themeAnchor.setAttribute('aria-expanded','false');if(back&&themeAnchor.isConnected)themeAnchor.focus({preventScroll:true})}themeAnchor=null}
function openThemeMenu(anchor){closeThemeMenu();themeAnchor=anchor;anchor.setAttribute('aria-expanded','true');
  const m=document.createElement('div');m.className='theme-menu';m.setAttribute('role','menu');m.setAttribute('aria-label','Tema');
  m.innerHTML='<p class="tm-t" aria-hidden="true">Tema</p>'+themeOpts();document.body.appendChild(m);themeMenuEl=m;
  const r=anchor.getBoundingClientRect(),w=m.offsetWidth;m.style.top=Math.round(r.bottom+scrollY+8)+'px';m.style.left=Math.round(scrollX+Math.max(8,Math.min(innerWidth-w-8,r.right-w)))+'px';
  (m.querySelector('[aria-checked=true]')||m.querySelector('button')).focus({preventScroll:true})}
function vTemaPanel(){const t=getTheme();return `<div class="panel"><h3>Aparência</h3><div class="theme-seg" role="radiogroup" aria-label="Tema">${THEMES.map(([k,ic,l])=>`<button role="radio" aria-checked="${t===k}" data-a="setTheme" data-v="${k}"><span aria-hidden="true">${ic}</span> ${l}</button>`).join('')}</div>
  <p class="small muted" style="margin:8px 0 0">${t==='auto'?'Segue o tema do celular (agora: '+(effTheme()==='dark'?'escuro':'claro')+'). ':''}Vale só para este aparelho.</p></div>`}
const hora=r=>r.time?(r.fim?r.time+'–'+r.fim:r.time):'';

/* =================== backends =================== */
function FirebaseBackend(cfg){
  firebase.initializeApp(cfg);const auth=firebase.auth(),fs=firebase.firestore();try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  return{demo:false,
    onAuth:cb=>auth.onAuthStateChanged(u=>cb(u?{uid:u.uid,email:u.email,anon:u.isAnonymous}:null)),
    login:(e,p)=>auth.signInWithEmailAndPassword(e,p),
    signup:(e,p)=>auth.createUserWithEmailAndPassword(e,p),
    reset:e=>auth.sendPasswordResetEmail(e),
    logout:()=>auth.signOut(),
    anon:()=>auth.signInAnonymously(),
    /* Google: abre a janela de escolha de conta. Se o navegador bloquear janelas

    r.times.forEach(t=>{const p=t.players;for(let x=0;x<p.length;x++)for(let y=x+1;y<p.length;y++){const k=key(p[x],p[y]);h[k]=(h[k]||0)+wt}})});return h}
function draw(pids,n,novelty,rid){
  const R=rat(),st=id=>lvl(id)/2;
  const hist=history(rid),sep=new Set((R.sep||[]).map(([a,b])=>key(a,b)));
  const N=pids.length,sizes=Array.from({length:n},(_,i)=>Math.floor(N/n)+(i<N%n?1:0)),wN=[0,1.5,4,9][novelty]??4;
  const P={};pids.forEach(id=>P[id]=ppos(id));
  function cost(T){let c=0;const avg=T.map(t=>t.reduce((s,id)=>s+st(id),0)/t.length*(N/n));c+=(Math.max(...avg)-Math.min(...avg))**2*6;
    const KEY=sport().key;for(const p of posKeys()){const cn=T.map(t=>t.filter(id=>P[id]===p).length),d=Math.max(...cn)-Math.min(...cn);c+=d*(p===KEY?6:2)+(d>1?(d-1)**2*(p===KEY?60:10):0)}
    const cr=T.map(t=>t.filter(id=>lvl(id)>=9).length);if(Math.max(...cr)-Math.min(...cr)>1)c+=25;
    for(const t of T)for(let x=0;x<t.length;x++)for(let y=x+1;y<t.length;y++){const k=key(t[x],t[y]);if(sep.has(k))c+=500;if(hist[k])c+=hist[k]*wN}return c}
  const sols=[],seen=new Set(),RS=N>20?50:120;
  for(let r=0;r<RS;r++){const sh=shuffle(pids.slice()),T=[];let k=0;sizes.forEach(s=>{T.push(sh.slice(k,k+s));k+=s});
    let c=cost(T),imp=true,g=0;
    while(imp&&g++<40){imp=false;for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let i=0;i<T[a].length;i++)for(let j=0;j<T[b].length;j++){
      [T[a][i],T[b][j]]=[T[b][j],T[a][i]];const c2=cost(T);if(c2<c-1e-9){c=c2;imp=true}else[T[a][i],T[b][j]]=[T[b][j],T[a][i]]}}
    const sig=T.map(t=>t.slice().sort().join(',')).sort().join('/');if(!seen.has(sig)){seen.add(sig);sols.push({T:T.map(t=>t.slice()),c})}}
  sols.sort((a,b)=>a.c-b.c);const best=sols[0].c,pool=sols.filter(s=>s.c<=best+Math.max(2,best*.08)).slice(0,6);
  return pool[Math.floor(Math.random()*pool.length)].T}
function quality(r){if(!r.times)return null;const R=rat(),st=id=>lvl(id);
  const avg=r.times.map(t=>t.players.reduce((s,id)=>s+st(id),0)/Math.max(1,t.players.length));
  const sep=new Set((R.sep||[]).map(([a,b])=>key(a,b)));let viol=0,pairs=0,rep=0;
  const prev=rodadas().filter(x=>x.id!==r.id&&x.times&&(x.date||'')<=(r.date||'9'))[0];const ps=new Set();
  if(prev)prev.times.forEach(t=>{const p=t.players;for(let x=0;x<p.length;x++)for(let y=x+1;y<p.length;y++)ps.add(key(p[x],p[y]))});

  if(sp==='outro'&&spn.length<2){toast('Diga qual é o esporte.');$('#ngo').focus();return null}
  let fixos=[];
  if(fq==='fixo'){fixos=[...box.querySelectorAll('.srow')].map(r=>({id:r.dataset.id||uid(),dow:+r.querySelector('.sd').value,ini:r.querySelector('.si').value,fim:r.querySelector('.sf').value,place:r.querySelector('.sl').value.trim()}));
    if(!fixos.length||fixos.some(x=>!x.ini)){toast('Informe o horário de início de cada dia.');return null}

/* ---------- Partida ---------- */
function vPartida(){
  const r=curRodada();
  if(!r||!r.times)return `<div class="panel empty"><h2>Sem times sorteados</h2><p class="muted">Sorteie os times na aba Rodada para começar.</p><button class="btn" data-a="tab" data-v="rodada">Ir para a rodada</button></div>`;
  if(!S.live||S.live.rid!==r.id||S.live.a>=r.times.length||S.live.b>=r.times.length)S.live={rid:r.id,a:0,b:1,goals:[],dur:cfg().minutes*60,el:0,run:false,st:0,beeped:false};
  const L=S.live,ta=r.times[L.a],tb=r.times[L.b],ca=col(ta.c),cb=col(tb.c);
  const ga=sumPts(L.goals,'a'),gb=sumPts(L.goals,'b'),SP=sport();
  const gt=t=>L.goals.filter(g=>g.t===t).map(g=>(g.pid?esc(pname(g.pid))+(g.og?' (contra)':''):'—')+((g.pts||1)>1?` (${g.pts})`:'')).join(', ');
  const sbtn=t=>SP.score.map(([l,v],i)=>`<button class="btn bib${SP.score.length>2?' sm':''}" data-a="goal" data-v="${t}" data-i="${i}">${SP.score.length===1?'+ '+l:l}</button>`).join('');
  const opt=(sel,skip)=>r.times.map((t,i)=>`<option value="${i}" ${i===sel?'selected':''} ${i===skip?'disabled':''}>${tn(t.c)}</option>`).join('');
  const ms=r.matches||[];
  return `<div class="stack">${rodadaPicker(r)}
  <div class="board"><div class="sides">
    <div><div class="tn"><span class="dot" style="background:${ca.c}"></span>${tn(ta.c)}</div><div class="sc">${ga}</div><div class="goals">${gt('a')}</div><div class="row" style="justify-content:center;gap:6px">${sbtn('a')}</div></div>
    <div class="x">×</div>
    <div><div class="tn"><span class="dot" style="background:${cb.c}"></span>${tn(tb.c)}</div><div class="sc">${gb}</div><div class="goals">${gt('b')}</div><div class="row" style="justify-content:center;gap:6px">${sbtn('b')}</div></div></div>
    <div id="clock">--:--</div><div id="clockMsg" class="clock-msg" role="status" hidden>Tempo esgotado</div>
    <div class="row" style="justify-content:center"><button class="btn" data-a="clock" id="clockBtn">${L.run?'Pausar':'Iniciar'}</button><button class="btn" data-a="clockReset">Zerar tempo</button><button class="btn" data-a="undoGoal" ${L.goals.length?'':'disabled'}>Desfazer último</button></div></div>
  <div class="panel"><div class="row">
    <label class="f" style="margin:0;flex:1;min-width:120px"><span>Time A</span><select class="sel" data-c="ta">${opt(L.a,L.b)}</select></label>
    <label class="f" style="margin:0;flex:1;min-width:120px"><span>Time B</span><select class="sel" data-c="tb">${opt(L.b,L.a)}</select></label>
    <label class="f" style="margin:0;width:110px"><span>Minutos</span><select class="sel" data-c="dur">${[5,7,8,10,12,15,20,25,30,45].map(m=>`<option ${m*60===L.dur?'selected':''}>${m}</option>`).join('')}</select></label></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-a="saveMatch">Encerrar e salvar partida</button>${r.times.length>2?'<span class="small muted">Depois de salvar, o vencedor fica e entra o próximo.</span>':''}</div></div>
  <div class="panel"><h3>Partidas desta rodada</h3>${ms.length?`<ul class="plist wrap">${ms.map((m,i)=>`<li><span class="num">${i+1}</span><span class="pn"><span class="dot" style="background:${col(m.ca).c}"></span> ${tn(m.ca)} <b>${m.ga} × ${m.gb}</b> ${tn(m.cb)} <span class="dot" style="background:${col(m.cb).c}"></span>
    <span class="small muted">${m.goals.filter(g=>g.pid&&!g.og).length?' — '+sport().word.toLowerCase()+': '+m.goals.filter(g=>g.pid&&!g.og).map(g=>esc(pname(g.pid))+((g.pts||1)>1?' ('+g.pts+')':'')).join(', '):''}</span></span><button class="btn sm ghost danger" data-a="delMatch" data-v="${i}">Apagar</button></li>`).join('')}</ul>`:'<p class="muted small">Nenhuma partida salva ainda.</p>'}</div></div>`}
function sumPts(gs,t){return gs.filter(g=>g.t===t).reduce((s,g)=>s+(g.pts||1),0)}
function elapsed(){const L=S.live;return L.el+(L.run?(Date.now()-L.st)/1000:0)}
function tick(){const el=document.getElementById('clock');if(!el||!S.live)return;const rem=S.live.dur-elapsed(),a=Math.abs(rem);
  el.textContent=(rem<0?'+':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(Math.floor(a%60)).padStart(2,'0');
  el.classList.toggle('over',rem<=0);const msg=document.getElementById('clockMsg');if(msg)msg.hidden=rem>0;if(rem<=0&&!S.live.beeped&&S.live.run){S.live.beeped=true;beep()}}
setInterval(()=>{if(S.tab==='partida'&&S.route.n==='admin')tick()},250);
let actx=null;
function beep(){try{if(!actx)return;[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.3);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.3)});if(navigator.vibrate)navigator.vibrate([300,150,300,150,300])}catch(e){}}

/* ---------- Ranking ---------- */
function computeStats(){const s={},g=id=>s[id]||(s[id]={id,j:0,v:0,e:0,d:0,gols:0,mvp:0,bagre:0});
  rodadas().forEach(r=>(r.matches||[]).forEach(m=>{const res=m.ga>m.gb?'a':m.ga<m.gb?'b':'e';
    m.pa.forEach(id=>{const x=g(id);x.j++;res==='a'?x.v++:res==='e'?x.e++:x.d++});m.pb.forEach(id=>{const x=g(id);x.j++;res==='b'?x.v++:res==='e'?x.e++:x.d++});
    m.goals.forEach(gl=>{if(gl.pid&&!gl.og)g(gl.pid).gols+=(gl.pts||1)})}));
  Object.values(S.vot).filter(v=>!v.open&&v.resultado).forEach(v=>v.cats.forEach(c=>(v.resultado[c.id]?.winners||[]).forEach(id=>{c.neg?g(id).bagre++:g(id).mvp++})));
  return Object.values(s).map(x=>Object.assign(x,{pts:x.v*3+x.e,ap:x.j?Math.round((x.v*3+x.e)/(x.j*3)*100):0}))}
function vRanking(){const st=computeStats(),k=S.rankSort;st.sort((a,b)=>(b[k]-a[k])||(b.pts-a.pts)||(b.gols-a.gols));
  const rs=rodadas().filter(r=>(r.matches||[]).length);
  const cols=[['pts','Pts'],['j','J'],['v','V'],['e','E'],['d','D'],['ap','Aprov.'],['gols',sport().word],['mvp','Destaques'],['bagre','Bagre']];
  return `<div class="stack"><div class="row between"><h2>Ranking</h2><label class="row small muted">Ordenar por <select class="sel" style="width:auto" data-c="rank">${cols.map(([c,l])=>`<option value="${c}" ${c===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
  ${st.length?`<div class="panel tbl"><table><thead><tr><th>#</th><th>Jogador</th>${cols.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>
  ${st.map((x,i)=>`<tr class="${i===0?'lead':''}"><td>${i+1}</td><td>${esc(pname(x.id))}</td><td class="pts">${x.pts}</td><td>${x.j}</td><td>${x.v}</td><td>${x.e}</td><td>${x.d}</td><td>${x.ap}%</td><td>${x.gols}</td><td>${x.mvp}</td><td>${x.bagre}</td></tr>`).join('')}</tbody></table>
  <p class="small muted" style="margin-top:8px">Vitória 3 pts, empate 1. Destaques e bagres vêm das votações encerradas.</p></div>`
  :'<div class="panel empty"><h2>Sem partidas ainda</h2><p class="muted">O ranking aparece quando a primeira partida for salva.</p></div>'}
  ${rs.length?`<div class="panel"><h3>Histórico</h3><ul class="plist wrap">${rs.map(r=>`<li><b style="min-width:110px">${fdate(r.date)}</b><span class="small muted pn">${r.matches.map(m=>`${tn(m.ca)} ${m.ga}×${m.gb} ${tn(m.cb)}`).join(' · ')}</span></li>`).join('')}</ul></div>`:''}</div>`}

/* ---------- Caixa ---------- */
function pendencias(month){const lan=Object.values(S.caixa),c=cfg();
  const mens=players().filter(p=>ptipo(p.id)!=='diarista'&&!lan.some(l=>l.k==='mensal'&&l.pid===p.id&&l.ref===month)).map(p=>({pid:p.id,k:'mensal',ref:month,v:c.mensal,label:'Mensalidade'}));
  const dia=[];rodadas().filter(r=>(r.date||'').slice(0,7)===month&&r.times).forEach(r=>r.times.forEach(t=>t.players.forEach(id=>{
    const tipo=S.jog[id]?ptipo(id):'avulso';if(tipo!=='mensalista'&&!lan.some(l=>l.k==='diaria'&&l.pid===id&&l.ref===r.id))dia.push({pid:id,k:'diaria',ref:r.id,v:c.diaria,label:'Diária '+fdate(r.date)})})));
  return mens.concat(dia)}
function vCaixa(){const lan=Object.entries(S.caixa).map(([id,v])=>Object.assign({id},v)),m=S.month;
  const inM=lan.filter(l=>(l.d||'').slice(0,7)===m).sort((a,b)=>(b.d||'').localeCompare(a.d||''));
  const saldo=lan.reduce((s,l)=>s+(l.k==='despesa'?-(+l.v||0):(+l.v||0)),0),ent=inM.filter(l=>l.k!=='despesa').reduce((s,l)=>s+(+l.v||0),0),sai=inM.filter(l=>l.k==='despesa').reduce((s,l)=>s+(+l.v||0),0);
  const pend=pendencias(m),KL={mensal:'Mensalidade',diaria:'Diária',entrada:'Outra entrada',despesa:'Despesa'};
  const months=[...new Set([today().slice(0,7),...lan.map(l=>(l.d||'').slice(0,7)),...rodadas().map(r=>(r.date||'').slice(0,7))].filter(Boolean))].sort().reverse();
  return `<div class="stack"><div class="row between"><h2>Caixa</h2><div class="row"><select class="sel" style="width:auto" data-c="month">${months.map(x=>`<option value="${x}" ${x===m?'selected':''}>${fmonth(x)}</option>`).join('')}</select><button class="btn primary" data-a="addLan">Lançar</button></div></div>
  <div class="panel kpis"><div><div class="l">Saldo do caixa</div><div class="money ${saldo<0?'neg':''}">${brl(saldo)}</div></div><div><div class="l">Entradas no mês</div><div class="money">${brl(ent)}</div></div><div><div class="l">Saídas no mês</div><div class="money">${brl(sai)}</div></div></div>
  <div class="grid2"><div class="panel"><div class="row between"><h3 style="margin:0">Pendentes</h3>${pend.length?'<button class="btn sm" data-a="shareCob">Cobrar no WhatsApp</button>':''}</div>
    <ul class="plist" style="margin-top:6px">${pend.map((p,i)=>`<li><span class="pn">${esc(pname(p.pid))} <span class="tag">${esc(p.label)}</span></span><b>${brl(p.v)}</b><button class="btn sm" data-a="payPend" data-v="${i}">Recebi</button></li>`).join('')||'<li class="muted small">Tudo em dia.</li>'}</ul></div>
   <div class="panel"><h3>Lançamentos do mês</h3><ul class="plist">${inM.map(l=>`<li><span class="pn">${esc(KL[l.k]||l.k)}${l.pid?' — '+esc(pname(l.pid)):''}${l.note?` <span class="tag">${esc(l.note)}</span>`:''}<br><span class="tag">${fdate(l.d)}</span></span><b style="color:${l.k==='despesa'?'var(--out)':'var(--in)'}">${l.k==='despesa'?'−':'+'}${brl(l.v)}</b><button class="btn sm ghost danger" data-a="delLan" data-v="${l.id}" aria-label="Apagar">✕</button></li>`).join('')||'<li class="muted small">Nenhum lançamento neste mês.</li>'}</ul></div></div></div>`}

/* ---------- Votação ---------- */
function tally(v,votos){const res={};v.cats.forEach(c=>res[c.id]={counts:{},total:0,winners:[]});
  Object.values(votos||{}).forEach(d=>Object.entries(d.v||{}).forEach(([cid,pid])=>{if(res[cid]){res[cid].counts[pid]=(res[cid].counts[pid]||0)+1;res[cid].total++}}));
  Object.values(res).forEach(x=>{const mx=Math.max(0,...Object.values(x.counts));x.winners=mx?Object.keys(x.counts).filter(k=>x.counts[k]===mx):[]});return res}
function candidates(v,c){const r=S.rod[v.rid];if(!r||!r.times)return[];let ids=r.times.flatMap(t=>t.players);if(c.pos)ids=ids.filter(id=>ppos(id)===c.pos);return ids.sort((a,b)=>pname(a).localeCompare(pname(b),'pt-BR'))}
function vVotacao(){const vs=Object.entries(S.vot).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  const v=vs.find(x=>x.id===S.vid)||vs[0];S.vid=v.id;const r=S.rod[v.rid],res=v.open?tally(v,S.votos):(v.resultado||tally(v,S.votos)),nv=Object.keys(S.votos).length;
  return `<div class="stack"><div class="row between"><div class="rsel"><select class="sel" data-c="vid">${vs.map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>${esc(x.title)}${S.rod[x.rid]?' — '+fdate(S.rod[x.rid].date):''}</option>`).join('')}</select><button class="btn" data-a="newVote">Nova</button></div></div>
  <div class="panel"><h2>${esc(v.title)}</h2><p class="muted small">${r?'Rodada de '+fdate(r.date)+' · ':''}${v.open?'Aberta':'Encerrada'} · ${nv} ${nv===1?'voto':'votos'}</p>
  <div class="row" style="margin-top:10px"><button class="btn sm primary" data-a="shareVote">${v.open?'Mandar link no WhatsApp':'Mandar resultado no WhatsApp'}</button><button class="btn sm" data-a="toggleVote">${v.open?'Encerrar votação':'Reabrir'}</button><button class="btn sm ghost danger" data-a="delVote">Excluir</button></div></div>
  ${v.cats.map(c=>{const R=res[c.id]||{counts:{},total:0,winners:[]};return `<div class="panel"><h3>${esc(c.name)}</h3><ul class="plist">${Object.entries(R.counts).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<li><span class="pn">${R.winners.includes(id)?'<b>':''}${esc(pname(id))}${R.winners.includes(id)?'</b>':''}</span><span class="bar"><i style="width:${n/R.total*100}%"></i></span><span class="small">${n}</span></li>`).join('')||'<li class="muted small">Sem votos ainda.</li>'}</ul></div>`}).join('')}</div>`}

document.addEventListener('click',e=>{
  const a=e.target.closest('a.btn,a.chip');if(a&&!a.dataset.a&&(a.getAttribute('href')||'').startsWith('#')){setBusy(a,true);setTimeout(()=>setBusy(a,false),4000);return}
  const el=e.target.closest('[data-a]');if(!el||el.disabled||el.classList.contains('busy'))return;const f=ACT[el.dataset.a];if(!f)return;
  if(el.tagName!=='A')e.preventDefault();
  const cap=[];cap.close=false;CAP=cap;let res;
  try{res=f(el,e)}catch(err){console.error(err)}finally{CAP=null}
  const ps=cap.slice();if(res&&typeof res.then==='function')ps.push(res);
  if(!ps.length){if(cap.close)closeDlgNow();return}
  setBusy(el,true);
  const pub=S.route.n==='r'||S.route.n==='v';let fim=false;const all=Promise.allSettled(ps).then(()=>{fim=true});
  /* Login não fica salvo para depois: o botão gira até a resposta (a janela do Google pode levar mais tempo). */
  const semLimite=['login','signup','google','reset'].includes(el.dataset.a);
  Promise.race(semLimite?[all]:[all,sleep(pub?5000:9000)]).then(()=>{setBusy(el,false);if(cap.close)closeDlgNow();applyBusy();if(!fim)avisoPendente(pub)});
});

function ensureVotos(){const id=S.tab==='votacao'?(S.vid||Object.keys(S.vot).sort((a,b)=>(S.vot[b].createdAt||0)-(S.vot[a].createdAt||0))[0]):null;if(S.votosVid===id)return;S.votosVid=id;S.votos={};drop('votos');if(id)sub('votos','votacoes/'+id+'/votos',d=>{S.votos=d||{}})}
function parseRoute(){const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='p'&&h[1]){if(h[2]==='r'&&h[3])return{n:'r',gid:h[1],id:h[3]};if(h[2]==='v'&&h[3])return{n:'v',gid:h[1],id:h[3]};return{n:'r',gid:h[1],id:null,next:true}}
  if(h[0]==='g'&&h[1])return{n:'admin',gid:h[1]};
  if(h[0]==='entrar')return{n:'auth',mode:'login'};if(h[0]==='criar')return{n:'auth',mode:'signup'};
  if(h[0]==='convite'&&h[1]&&h[2])return{n:'inv',gid:h[1],token:h[2]};
  return{n:'home'}}
function upMyGroup(gid,patch){const me=cl(S.me)||{grupos:{}};me.grupos=me.grupos||{};me.grupos[gid]=Object.assign({},me.grupos[gid]||{},patch);S.me=me;return B.set('usuarios/'+S.user.uid,me)}
function addMyGroup(gid,name,role,sp,spn){return upMyGroup(gid,{name,role,sport:sp||'futebol',sportName:spn||''})}
function syncName(){const g=S.me?.grupos?.[S.gid],a=S.app;if(S.route.n!=='admin'||!a||!S.mem||!g)return;
  const want={name:a.name,sport:a.sport||'futebol',sportName:a.sportName||'',ativo:a.ativo!==false,criado:a.createdAt||null};
  if(Object.keys(want).some(k=>(g[k]??null)!==(want[k]??null)))upMyGroup(S.gid,want).catch(()=>{})}
function setupRoute(){
  closeDlgNow();dropAll();S.route=parseRoute();const R=S.route,logged=!!(S.user&&!S.user.anon);
  if(R.n==='auth'){if(logged){location.hash='#/';return}S.authMode=R.mode}
  window.scrollTo(0,0);
  if(R.n==='r'||R.n==='v'){try{localStorage.setItem('pelada-last',location.hash)}catch(e){}}
  Object.assign(S,{avul:{},cont:{},pc:null,migrando:false,gid:R.gid||null,app:null,mem:null,membros:{},convite:null,rat:null,caixa:{},presRid:undefined,votosVid:undefined,dataOn:false,rod:{},pres:{},vot:{},votos:{},myVote:null,jog:{},rid:null,vid:null,live:null});
  if(logged)subRaw('me','usuarios/'+S.user.uid,d=>{S.me=d||{grupos:{}};syncName();
    if(S.route.n==='home'&&!S.homeShown){S.homeShown=true;const all=Object.entries(S.me.grupos||{}),g=all.filter(([,v])=>v.ativo!==false).map(([k])=>k);if(g.length===1)location.hash='#/g/'+g[0];else if(!all.length)setTimeout(()=>{if(S.route.n==='home'&&!dlg.open)ACT.newGroup()},250)}});
  if(S.gid)sub('app','config/app',d=>{S.app=d;if(R.next)resolveNext();syncName();migrarPrivado()});
  const anon=()=>{if(!S.user)B.anon().catch(()=>toast('Não foi possível conectar. Recarregue a página.'))};
  if(R.n==='r'&&R.next){anon();
    sub('jog','jogadores',d=>{S.jog=d||{}});sub('avul','avulsos',d=>{S.avul=d||{}});
    sub('rods','rodadas',d=>{S.rod=d||{};resolveNext()});
  }else if(R.n==='r'){anon();
    sub('jog','jogadores',d=>{S.jog=d||{}});sub('avul','avulsos',d=>{S.avul=d||{}});
    sub('r','rodadas/'+R.id,d=>{if(d)S.rod={[R.id]:d};else S.rod={}});
    S.presRid=R.id;sub('pres','rodadas/'+R.id+'/presencas',d=>{S.pres=d||{}});
  }else if(R.n==='v'){anon();
    sub('jog','jogadores',d=>{S.jog=d||{}});
    sub('v','votacoes/'+R.id,d=>{S.vot=d?{[R.id]:d}:{};if(d&&!SUBS.rv)sub('rv','rodadas/'+d.rid,x=>{S.rod=x?{[d.rid]:x}:{}})});
    if(S.user)sub('mv','votacoes/'+R.id+'/votos/'+S.user.uid,d=>{const keep=S.myVote?.pid;S.myVote=d||(keep?{pid:keep,v:{}}:null)});
  }else if((R.n==='admin'||R.n==='inv')&&logged){
    sub('mem','membros/'+S.user.uid,d=>{S.mem=d;if(d&&R.n==='admin')startData();syncName()});
  }
  render();
  if(R.n==='auth'||(R.n==='inv'&&!logged))focusEmail();
}
function focusEmail(){let n=0;const t=setInterval(()=>{const i=$('#le');if(i){i.focus();clearInterval(t)}else if(++n>40)clearInterval(t)},50)}
function resolveNext(){if(!S.loaded.app||!S.loaded.rods)return;const r=upcoming()[0],id=r?r.id:null;
  if(S.route.id!==id||S.presRid!==id){S.route.id=id;S.presRid=id;S.pres={};drop('pres');if(id)sub('pres','rodadas/'+id+'/presencas',d=>{S.pres=d||{}})}}
function startData(){if(S.dataOn)return;S.dataOn=true;
  sub('rat','privado/ratings',d=>{S.rat=d});sub('cont','privado/contatos',d=>{S.cont=d||{}});sub('avul','avulsos',d=>{S.avul=d||{};regAvulsos()});sub('jog','jogadores',d=>{S.jog=d||{};migrarPrivado()});sub('rod','rodadas',d=>{S.rod=d||{};regAvulsos()});
  sub('pc','privado/caixa',d=>{S.pc=d;migrarPrivado()});
  sub('caixa','caixa',d=>{S.caixa=d||{}});sub('vot','votacoes',d=>{S.vot=d||{}});sub('membros','membros',d=>{S.membros=d||{}});sub('convite','privado/convite',d=>{S.convite=d})}

/* =================== boot =================== */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function boot(){
  applyTheme();
  const C=window.FIREBASE_CONFIG||{};
  if(C.apiKey&&C.projectId){
    try{const v='10.12.2',base=`https://www.gstatic.com/firebasejs/${v}/`;await loadScript(base+'firebase-app-compat.js');await loadScript(base+'firebase-auth-compat.js');await loadScript(base+'firebase-firestore-compat.js');B=wrapBackend(FirebaseBackend(C))}
    catch(e){main.innerHTML='<div class="panel empty"><h2>Não foi possível carregar</h2><p class="muted">Verifique sua conexão e recarregue a página.</p></div>';return}
  }else B=wrapBackend(LocalBackend());
  try{S.authMode=localStorage.getItem('pelada-mode')||'signup'}catch(e){S.authMode='signup'}
  if(B.redirectResult)B.redirectResult().catch(e=>{if(AUTH_CANCEL.includes(e&&e.code))return;console.warn(e);const m=authMsg(e);setTimeout(()=>{const le=$('#lerr');if(le)le.textContent=m;else toast(m,6000)},300)});
  let first=true;
  B.onAuth(u=>{const prev=S.user;S.user=u;
    if(first&&isStandalone()&&(!location.hash||location.hash==='#/')&&(!u||u.anon)){let last=null;try{last=localStorage.getItem('pelada-last')}catch(e){}if(last){first=false;S.user=u;location.hash=last;return}}
    const changedUser=first||(prev?.uid!==u?.uid);first=false;
    if(changedUser){S.me=null;S.homeShown=false;setupRoute()}else render()});
  window.addEventListener('hashchange',setupRoute);
}
boot();

/* =================== PWA =================== */
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
let installEvt=null;const ib=$('#installBtn');
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(!isStandalone())ib.hidden=false});
window.addEventListener('appinstalled',()=>{ib.hidden=true;installEvt=null;toast('App instalado.')});
if(isIOS&&!isStandalone()&&location.protocol.startsWith('http'))ib.hidden=false;
ib.addEventListener('click',async()=>{
  if(installEvt){installEvt.prompt();const r=await installEvt.userChoice;if(r.outcome==='accepted')ib.hidden=true;installEvt=null;return}
  openDlg(`<h3>Instalar no celular</h3>${isIOS?`<ol class="small" style="padding-left:18px;line-height:1.8"><li>Abra esta página no <b>Safari</b>.</li><li>Toque no botão <b>Compartilhar</b> (quadrado com seta para cima).</li><li>Escolha <b>Adicionar à Tela de Início</b> e confirme.</li></ol>`
  :`<ol class="small" style="padding-left:18px;line-height:1.8"><li>Abra o menu do navegador (⋮).</li><li>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li></ol>`}
  <p class="small muted">O ícone do Nosso Jogo aparece junto dos seus apps e abre direto, em tela cheia.</p><div class="dlg-f"><button class="btn primary" data-a="close">Entendi</button></div>`)});
const netBar=()=>{$('#net').hidden=navigator.onLine};window.addEventListener('online',netBar);window.addEventListener('offline',netBar);netBar();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
    const show=()=>{$('#upd').hidden=false};
    if(reg.waiting&&navigator.serviceWorker.controller)show();
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)show()})});
    $('#updBtn').onclick=()=>{(reg.waiting||reg.installing)?.postMessage('skipWaiting')};
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{})});
  /* Só recarrega quando uma versão nova substitui a antiga. Na primeira visita não recarrega,
     para não apagar o que a pessoa já começou a digitar. */
  const hadCtrl=!!navigator.serviceWorker.controller;
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||!hadCtrl)return;reloaded=true;location.reload()});
}
</script>
